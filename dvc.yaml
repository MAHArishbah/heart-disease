
stages:
  train:
    cmd: python -m disease_pred.train
    deps:
      - data/raw
      - src/disease_pred/config.py
      - src/disease_pred/data.py
      - src/disease_pred/features.py
      - src/disease_pred/train.py
    params:
      - seed
      - data
      - features
      - model
      - decision #not needed in eval as it will take from specs.json
    outs:
      - models/model.joblib
      - models/feature_spec.json
      - models/reference.csv #for dirft monitoring 
    metrics:
      - reports/train_metrics.json:
          cache: false #false keeps them in git so ci can run diff with origin/main without downloaing anything

  evaluate:
    cmd: python -m disease_pred.evaluate
    deps:
      - data/raw
      - models/model.joblib
      - models/feature_spec.json
      - src/disease_pred/config.py
      - src/disease_pred/data.py
      - src/disease_pred/train.py #imports oof_predictions from train.py
      - src/disease_pred/evaluate.py
      - src/disease_pred/tracking.py
      - src/disease_pred/features.py #is indirect dependecy through train.py
    params:
      - seed
      - data
      - features
      - model
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/classification_report.txt:
          cache: false
      - reports/subgroups.md:
          cache: false