            - ca
          missing_indicators:
          - trestbps
          - thalach
          - oldpeak
          drop_high_missing: true
          missing_threshold: 0.3
          include_site: false
        model:
          max_iter: 5000
          cv_folds: 5
          grid:
            C_logspace:
            - -5
            - 2
            - 15
            l1_ratio:
            - 0.0
            - 0.25
            - 0.5
            - 0.75
            - 1.0
        seed: 42
